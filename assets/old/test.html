<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prof
      
    </title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-body-secondary">
    <main class="min-vh-100 d-flex align-items-center justify-content-center p-3">
      <section
        class="position-relative overflow-hidden text-center bg-white"
        style="width: min(1121px, 100vmin); height: min(1121px, 100vmin)"
      >
        <img
          src="../../images/github_prof.jpeg"
          alt="GitHub profile photo"
          class="w-100 h-100 object-fit-contain"
        />

        <div
          class="position-absolute start-50 translate-middle-x w-100 px-5"
          style="top: 52%"
        >
          <div class="row row-cols-3 g-4 justify-content-center align-items-center">
            <div class="col text-center">
              <img
                src="../../images/portfolio_qr.png"
                alt="Portfolio QR code"
                class="img-fluid"
                style="max-width: clamp(72px, 18vw, 240px)"
              />
            </div>
            <div class="col text-center">
              <img
                src="../../images/github_identicon.png"
                alt="GitHub identicon"
                class="img-fluid"
                style="max-width: clamp(72px, 18vw, 240px)"
              />
            </div>
            <div class="col text-center">
              <img
                src="../../images/linkedin_qr.png"
                alt="LinkedIn QR code"
                class="img-fluid"
                style="max-width: clamp(72px, 18vw, 240px)"
              />
            </div>
          </div>
        </div>
      </section>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
